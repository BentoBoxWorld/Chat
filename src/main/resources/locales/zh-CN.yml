chat:
  team-chat:
    description: "切换团队聊天开闭"
    chat-on: <green>团队聊天已开启.</green>
    chat-off: <red>团队聊天已关闭.</red>
    syntax: <gold>[team]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    mute:
      description: "切换静音团队聊天消息"
      mute-on: <red>团队聊天已静音.</red>
      mute-off: <green>团队聊天已取消静音.</green>
    spy:
      description: "切换偷听所有团队聊天"
      spy-on: <green>团队聊天偷听已开启.</green>
      spy-off: <red>团队聊天偷听已关闭.</red>
      syntax: <red>[team-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
  island-chat:
    description: "切换岛屿聊天开闭"
    island-on: <green>岛屿聊天已开启.</green>
    island-off: <red>岛屿聊天已关闭.</red>
    syntax: <gold>[island]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    spy:
      description: "切换偷听所有岛屿聊天"
      spy-on: <green>岛屿聊天偷听已开启.</green>
      spy-off: <red>岛屿聊天偷听已关闭.</red>
      syntax: <red>[island-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
