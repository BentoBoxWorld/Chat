chat:
  team-chat:
    description: "toggles team chat on/off"
    chat-on: <green>Team chat on.</green>
    chat-off: <red>Team chat off.</red>
    syntax: <gold>[team]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    mute:
      description: "toggles muting team chat messages"
      mute-on: <red>Team chat muted.</red>
      mute-off: <green>Team chat unmuted.</green>
    spy:
      description: "toggles spying on all team chats"
      spy-on: <green>Team chat spy on.</green>
      spy-off: <red>Team chat spy off.</red>
      syntax: <red>[team-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
  island-chat:
    description: "toggles island chat on/off"
    island-on: <green>Island chat on.</green>
    island-off: <red>Island chat off.</red>
    syntax: <gold>[island]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    spy:
      description: "toggles spying on all island chats"
      spy-on: <green>Island chat spy on.</green>
      spy-off: <red>Island chat spy off.</red>
      syntax: <red>[island-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
