chat:
  team-chat:
    description: "activează/dezactivează chat-ul de echipă"
    chat-on: "&a Chat de echipă activat."
    chat-off: "&a Chat de echipă dezactivat."
    syntax: "&6[team] &a[name]&8: &f[message]"
    mute:
      description: "activează/dezactivează dezactivarea sunetului chat-ului de echipă"
      mute-on: "&c Chat de echipă dezactivat sonor."
      mute-off: "&a Chat de echipă reactivat sonor."
    spy:
      description: "activează/dezactivează spionarea tuturor chat-urilor de echipă"
      spy-on: "&a Spion chat de echipă activat."
      spy-off: "&c Spion chat de echipă dezactivat."
      syntax: "&c[team-chat-spy] &a[name]&8: [message]"
  island-chat:
    description: "activează/dezactivează chat-ul de insulă"
    island-on: "&a Chat de insulă activat."
    island-off: "&c Chat de insulă dezactivat."
    syntax: "&6[island] &a[name]&8: &f[message]"
    spy:
      description: "activează/dezactivează spionarea tuturor chat-urilor de insulă"
      spy-on: "&a Spion chat de insulă activat."
      spy-off: "&c Spion chat de insulă dezactivat."
      syntax: "&c [island-chat-spy] &a[name]&8: &f[message]"
