chat:
  team-chat:
    description: "Přepnout týmový chat zapnuto/vypnuto"
    chat-on: <green>Týmový chat zapnut</green>
    chat-off: <red>Týmový chat vypnut</red>
    syntax: <gold>[team]</gold><green>[name]</green>  <white>[message]</white>
    mute:
      description: "Přepnout ztlumení zpráv týmového chatu"
      mute-on: <red>Týmový chat ztlumen.</red>
      mute-off: <green>Týmový chat odztlumen.</green>
    spy:
      description: "Přepnout šmírování všech týmových chatů"
      spy-on: <green>Šmírování týmových chatů zapnuto</green>
      spy-off: <red>Šmírování týmových chatů vypnuto</red>
      syntax: <red>[team-chat-spy]</red> <dark_red>[name]</dark_red>: [message]
  island-chat:
    description: "Přepnout chat na ostrově zapnuto/vypnuto"
    island-on: <green>Chat na ostrově zapnut</green>
    island-off: <red>Chat na ostrově vypnut</red>
    syntax: <gold>[island]</gold><green>[name]</green>  <white>[message]</white>
    spy:
      description: "Přepnout šmírování chatů na všech ostrovech"
      spy-on: <green>Šmírování chatů na ostrovech zapnuto</green>
      spy-off: <red>Šmírování chatů na ostrovech vypnuto</red>
      syntax: <red>[island-chat-spy]</red> <dark_red>[name]</dark_red>: [message]
