chat:
  team-chat:
    description: "activer/désactiver le chat d'équipe"
    chat-on: "<green>Chat d'équipe activé.</green>"
    chat-off: "<red>Chat d'équipe désactivé.</red>"
    syntax: "<gold>[team]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>"
    mute:
      description: "activer/désactiver la mise en sourdine des messages du chat d'équipe"
      mute-on: "<red>Chat d'équipe mis en sourdine.</red>"
      mute-off: "<green>Chat d'équipe sorti de sourdine.</green>"
      reminder: "<gray>(Chat d'équipe mis en sourdine - utilise /teamchat mute pour sortir de la sourdine)</gray>"
    spy:
      description: "activer/désactiver la surveillance de tous les chats d'équipe"
      spy-on: "<green>Surveillance des chats d'équipe activée.</green>"
      spy-off: "<red>Surveillance des chats d'équipe désactivée.</red>"
      syntax: "<red>[team-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>"
  island-chat:
    description: "activer/désactiver le chat d'île"
    island-on: "<green>Chat d'île activé.</green>"
    island-off: "<red>Chat d'île désactivé.</red>"
    syntax: "<gold>[island]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>"
    spy:
      description: "activer/désactiver la surveillance de tous les chats d'île"
      spy-on: "<green>Surveillance des chats d'île activée.</green>"
      spy-off: "<red>Surveillance des chats d'île désactivée.</red>"
      syntax: "<red>[island-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>"
