chat:
  team-chat:
    description: "zet teamchat aan/uit"
    chat-on: "&a Teamchat aan."
    chat-off: "&a Teamchat uit."
    syntax: "&6[team] &a[name]&8: &f[message]"
    mute:
      description: "zet het dempen van teamchat berichten aan/uit"
      mute-on: "&c Teamchat gedempt."
      mute-off: "&a Teamchat niet meer gedempt."
    spy:
      description: "zet het bespioneren van alle teamchats aan/uit"
      spy-on: "&a Teamchat spion aan."
      spy-off: "&c Teamchat spion uit."
      syntax: "&c[team-chat-spy] &a[name]&8: [message]"
  island-chat:
    description: "zet eilandchat aan/uit"
    island-on: "&a Eilandchat aan."
    island-off: "&c Eilandchat uit."
    syntax: "&6[island] &a[name]&8: &f[message]"
    spy:
      description: "zet het bespioneren van alle eilandchats aan/uit"
      spy-on: "&a Eilandchat spion aan."
      spy-off: "&c Eilandchat spion uit."
      syntax: "&c [island-chat-spy] &a[name]&8: &f[message]"
