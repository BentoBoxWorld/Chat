---
chat:
  team-chat:
    description: チームチャットのオン/オフを切り替えます
    chat-on: "&a チームチャット オン."
    chat-off: "&a チームチャット オフ."
    syntax: "&6[team] &a[name]&8: &f[message]"
    mute:
      description: チームチャットメッセージのミュートを切り替えます
      mute-on: "&c チームチャットをミュートしました."
      mute-off: "&a チームチャットのミュートを解除しました."
    spy:
      description: すべてのチームチャットのスパイを切り替えます
      spy-on: "&a チームチャットスパイ オン."
      spy-off: "&c チームチャットスパイ オフ."
      syntax: "&c[team-chat-spy] &a[name]&8: [message]"
  island-chat:
    description: アイランドチャットのオン/オフを切り替えます
    island-on: "&a アイランドチャット オン."
    island-off: "&c アイランドチャット オフ."
    syntax: "&6[island] &a[name]&8: &f[message]"
    spy:
      description: すべての島のチャットのスパイを切り替えます
      spy-on: "&a アイランドチャットスパイ オン."
      spy-off: "&c アイランドチャットスパイ オフ."
      syntax: "&c[island-chat-spy] &a[name]&8: &f[message]"
