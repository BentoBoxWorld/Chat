---
chat:
  team-chat:
    description: チームチャットのオン/オフを切り替えます
    chat-on: <green>チームチャット オン.</green>
    chat-off: <red>チームチャット オフ.</red>
    syntax: <gold>[team]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    mute:
      description: チームチャットメッセージのミュートを切り替えます
      mute-on: <red>チームチャットをミュートしました.</red>
      mute-off: <green>チームチャットのミュートを解除しました.</green>
      reminder: <gray>(チームチャットがミュートされています - /teamchat mute でミュートを解除してください)</gray>
    spy:
      description: すべてのチームチャットのスパイを切り替えます
      spy-on: <green>チームチャットスパイ オン.</green>
      spy-off: <red>チームチャットスパイ オフ.</red>
      syntax: <red>[team-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
  island-chat:
    description: アイランドチャットのオン/オフを切り替えます
    island-on: <green>アイランドチャット オン.</green>
    island-off: <red>アイランドチャット オフ.</red>
    syntax: <gold>[island]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    spy:
      description: すべての島のチャットのスパイを切り替えます
      spy-on: <green>アイランドチャットスパイ オン.</green>
      spy-off: <red>アイランドチャットスパイ オフ.</red>
      syntax: <red>[island-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
