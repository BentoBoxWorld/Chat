chat:
  team-chat:
    description: bật/tắt chat đội
    chat-on: <green>Đã bật chat đội.</green>
    chat-off: <red>Đã tắt chat đội.</red>
    syntax: <gold>[team]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    mute:
      description: bật/tắt tắt tiếng tin nhắn chat đội
      mute-on: <red>Đã tắt tiếng chat đội.</red>
      mute-off: <green>Đã bỏ tắt tiếng chat đội.</green>
    spy:
      description: bật/tắt giám sát chat đội
      spy-on: <green>Đã bật giám sát chat đội.</green>
      spy-off: <red>Đã tắt giám sát chat đội.</red>
      syntax: <red>[team-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
  island-chat:
    description: bật/tắt chat đảo
    island-on: <green>Đã bật chat đảo.</green>
    island-off: <red>Đã tắt chat đảo.</red>
    syntax: <gold>[island]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    spy:
      description: bật/tắt giám sát chat đảo
      spy-on: <green>Đã bật giám sát chat đảo.</green>
      spy-off: <red>Đã tắt giám sát chat đảo.</red>
      syntax: <red>[island-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
