chat:
  team-chat:
    description: "attiva/disattiva la chat del team"
    chat-on: "&a Chat del team attivata."
    chat-off: "&a Chat del team disattivata."
    syntax: "&6[team] &a[name]&8: &f[message]"
    mute:
      description: "attiva/disattiva il silenziamento dei messaggi della chat del team"
      mute-on: "&c Chat del team silenziata."
      mute-off: "&a Chat del team non più silenziata."
    spy:
      description: "attiva/disattiva la spia su tutte le chat del team"
      spy-on: "&a Spia chat del team attivata."
      spy-off: "&c Spia chat del team disattivata."
      syntax: "&c[team-chat-spy] &a[name]&8: [message]"
  island-chat:
    description: "attiva/disattiva la chat dell'isola"
    island-on: "&a Chat dell'isola attivata."
    island-off: "&c Chat dell'isola disattivata."
    syntax: "&6[island] &a[name]&8: &f[message]"
    spy:
      description: "attiva/disattiva la spia su tutte le chat dell'isola"
      spy-on: "&a Spia chat dell'isola attivata."
      spy-off: "&c Spia chat dell'isola disattivata."
      syntax: "&c [island-chat-spy] &a[name]&8: &f[message]"
