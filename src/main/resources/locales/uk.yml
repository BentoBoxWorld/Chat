chat:
  team-chat:
    description: "вмикає/вимикає командний чат"
    chat-on: "&a Командний чат увімкнено."
    chat-off: "&a Командний чат вимкнено."
    syntax: "&6[team] &a[name]&8: &f[message]"
    mute:
      description: "вмикає/вимикає ігнорування повідомлень командного чату"
      mute-on: "&c Командний чат заглушено."
      mute-off: "&a Командний чат розглушено."
    spy:
      description: "вмикає/вимикає стеження за всіма командними чатами"
      spy-on: "&a Стеження за командним чатом увімкнено."
      spy-off: "&c Стеження за командним чатом вимкнено."
      syntax: "&c[team-chat-spy] &a[name]&8: [message]"
  island-chat:
    description: "вмикає/вимикає чат острова"
    island-on: "&a Чат острова увімкнено."
    island-off: "&c Чат острова вимкнено."
    syntax: "&6[island] &a[name]&8: &f[message]"
    spy:
      description: "вмикає/вимикає стеження за всіма чатами острова"
      spy-on: "&a Стеження за чатом острова увімкнено."
      spy-off: "&c Стеження за чатом острова вимкнено."
      syntax: "&c [island-chat-spy] &a[name]&8: &f[message]"
