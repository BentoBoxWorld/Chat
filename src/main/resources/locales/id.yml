chat:
  team-chat:
    description: "nyala/matikan percakapan tim"
    chat-on: <green>Percakapan tim dinyalakan.</green>
    chat-off: <red>Percakapan tim dimatikan.</red>
    syntax: <gold>[team]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    mute:
      description: "nyala/matikan senyap pesan percakapan tim"
      mute-on: <red>Percakapan tim dibisukan.</red>
      mute-off: <green>Percakapan tim tidak lagi dibisukan.</green>
    spy:
      description: "nyala/matikan pengawasan pada semua percakapan tim"
      spy-on: <green>Pengawasan percakapan tim dinyalakan.</green>
      spy-off: <red>Pengawasan percakapan tim dimatikan.</red>
      syntax: <red>[team-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
  island-chat:
    description: "nyala/matikan percakapan pulau"
    island-on: <green>Percakapan pulau dinyalakan.</green>
    island-off: <red>Percakapan pulau dimatikan.</red>
    syntax: <gold>[island]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    spy:
      description: "nyala/matikan pengawasan pada semua percakapan pulau"
      spy-on: <green>Pengawasan percakapan pulau dinyalakan.</green>
      spy-off: <red>Pengawasan percakapan pulau dimatikan.</red>
      syntax: <red>[island-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
