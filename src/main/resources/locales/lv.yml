chat:
  team-chat:
    description: "ieslēdz/izslēdz komandas tērzēšanu"
    chat-on: <green>Komandas tērzēšana ieslēgta.</green>
    chat-off: <red>Komandas tērzēšana izslēgta.</red>
    syntax: <gold>[team]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    mute:
      description: "ieslēdz/izslēdz komandas tērzēšanas ziņojumu apklusināšanu"
      mute-on: <red>Komandas tērzēšana apklusināta.</red>
      mute-off: <green>Komandas tērzēšanas apklusināšana atcelta.</green>
      reminder: <gray>(Komandas tērzēšana apklusināta - izmanto /teamchat mute, lai atceltu apklusināšanu)</gray>
    spy:
      description: "ieslēdz/izslēdz visas komandas tērzēšanas uzraudzību"
      spy-on: <green>Komandas tērzēšanas uzraudzība ieslēgta.</green>
      spy-off: <red>Komandas tērzēšanas uzraudzība izslēgta.</red>
      syntax: <red>[team-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
  island-chat:
    description: "ieslēdz/izslēdz salas tērzēšanu"
    island-on: <green>Salas tērzēšana ieslēgta.</green>
    island-off: <red>Salas tērzēšana izslēgta.</red>
    syntax: <gold>[island]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    spy:
      description: "ieslēdz/izslēdz visu salu tērzēšanas uzraudzību"
      spy-on: <green>Salas tērzēšanas uzraudzība ieslēgta.</green>
      spy-off: <red>Salas tērzēšanas uzraudzība izslēgta.</red>
      syntax: <red>[island-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
