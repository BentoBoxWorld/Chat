chat:
  team-chat:
    description: csapat chat állítása be/ki
    chat-on: <green>Csapat chat be.</green>
    chat-off: <red>Csapat chat ki.</red>
    syntax: <gold>[team]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    mute:
      description: csapat chat üzenetek elnémítása be/ki
      mute-on: <red>Csapat chat elnémítva.</red>
      mute-off: <green>Csapat chat elnémítás feloldva.</green>
      reminder: <gray>(Csapat chat elnémítva - használd a /teamchat mute parancsot az elnémítás feloldásához)</gray>
    spy:
      description: kémkedés állítása az összes csapat chatben
      spy-on: <green>Csapat chat kémkedés be.</green>
      spy-off: <red>Csapat chat kémkedés ki.</red>
      syntax: <red>[team-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
  island-chat:
    description: sziget chat állítása be/ki
    island-on: <green>Sziget chat be.</green>
    island-off: <red>Sziget chat ki.</red>
    syntax: <gold>[island]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    spy:
      description: kémkedés állítása az összes sziget chatben
      spy-on: <green>Sziget chat kémkedés be.</green>
      spy-off: <red>Sziget chat kémkedés ki.</red>
      syntax: <red>[island-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
