chat:
  team-chat:
    description: "włącza/wyłącza czat drużynowy"
    chat-on: <green>Czat drużynowy włączony.</green>
    chat-off: <red>Czat drużynowy wyłączony.</red>
    syntax: <gold>[team]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    mute:
      description: "włącza/wyłącza wyciszanie wiadomości czatu drużynowego"
      mute-on: <red>Czat drużynowy wyciszony.</red>
      mute-off: <green>Czat drużynowy odciszony.</green>
    spy:
      description: "włącza/wyłącza szpiegowanie wszystkich czatów drużynowych"
      spy-on: <green>Szpiegowanie czatu drużynowego włączone.</green>
      spy-off: <red>Szpiegowanie czatu drużynowego wyłączone.</red>
      syntax: <red>[team-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
  island-chat:
    description: "włącza/wyłącza czat wyspy"
    island-on: <green>Czat wyspy włączony.</green>
    island-off: <red>Czat wyspy wyłączony.</red>
    syntax: <gold>[island]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    spy:
      description: "włącza/wyłącza szpiegowanie wszystkich czatów wyspy"
      spy-on: <green>Szpiegowanie czatu wyspy włączone.</green>
      spy-off: <red>Szpiegowanie czatu wyspy wyłączone.</red>
      syntax: <red>[island-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
