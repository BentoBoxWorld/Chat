chat:
  team-chat:
    description: "uključuje/isključuje timski chat"
    chat-on: <green>Timski chat uključen.</green>
    chat-off: <red>Timski chat isključen.</red>
    syntax: <gold>[team]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    mute:
      description: "uključuje/isključuje nijeme poruke timskog chata"
      mute-on: <red>Timski chat je utišan.</red>
      mute-off: <green>Timski chat više nije utišan.</green>
      reminder: <gray>(Timski chat je utišan - koristi /teamchat mute za aktiviranje)</gray>
    spy:
      description: "uključuje/isključuje praćenje svih timskih chatova"
      spy-on: <green>Praćenje timskog chata uključeno.</green>
      spy-off: <red>Praćenje timskog chata isključeno.</red>
      syntax: <red>[team-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
  island-chat:
    description: "uključuje/isključuje chat otoka"
    island-on: <green>Chat otoka uključen.</green>
    island-off: <red>Chat otoka isključen.</red>
    syntax: <gold>[island]</gold> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
    spy:
      description: "uključuje/isključuje praćenje svih chatova otoka"
      spy-on: <green>Praćenje chata otoka uključeno.</green>
      spy-off: <red>Praćenje chata otoka isključeno.</red>
      syntax: <red>[island-chat-spy]</red> <green>[name]</green><dark_gray>:</dark_gray> <white>[message]</white>
